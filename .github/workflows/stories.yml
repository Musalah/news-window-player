name: Fetch stories

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rescan:
        description: Re-read every snap (text and ads), ignoring the cache
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: macos-latest # Apple Vision reads the snaps' Arabic far better than tesseract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-stories.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Best-effort: if reading fails, stories still update, just without new text or ad flags.
      - name: Read snaps (text and ads)
        continue-on-error: true
        timeout-minutes: 9
        run: |
          pip install -q pillow
          python3 scripts/scan-snaps.py ${{ inputs.rescan && '--rescan' || '' }}
      - name: Commit if changed
        run: |
          [ -z "$(git status --porcelain -- stories.json ocr.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories.json ocr.json
          git commit -m "Update stories"
          git push
