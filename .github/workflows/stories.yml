name: Fetch stories

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      rescan:
        description: Re-check every snap for ads, ignoring the cache
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: stories
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-stories.mjs
      # Ad detection is best-effort: if it fails, stories still update, just without ad flags.
      - name: Install OCR tools
        id: ocr
        continue-on-error: true
        timeout-minutes: 4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o DPkg::Lock::Timeout=60 --no-install-recommends tesseract-ocr tesseract-ocr-ara ffmpeg >/dev/null
          pip install -q pillow
      - name: Flag ads
        if: steps.ocr.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/detect-ads.py ${{ inputs.rescan && '--rescan' || '' }}
      - name: Commit if changed
        run: |
          [ -z "$(git status --porcelain -- stories.json ads-cache.json)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories.json ads-cache.json
          git commit -m "Update stories"
          git push
